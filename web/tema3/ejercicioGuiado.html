<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="practicaGuiada.php" method="post">
        <label for="nombre">Nombre de usuario:</label><br>
        <input type="text" name="nombre" id="nombre" required><br><br>
        <label for="titulo">Título de la reseña:</label><br>
        <input type="text" name="titulo" id="titulo" required><br><br>
        <label for="reseña">Reseña:</label><br>
        <textarea name="reseña" id="reseña" rows="5" required></textarea><br><br>
        <label for="calificacion">Calificación (1 al 5):</label><br>
        <input type="number" name="calificacion" id="calificacion" min="1" max="5" required><br><br>
        <button type="submit">Enviar</button><br>
    </form>
</body>
</html>
