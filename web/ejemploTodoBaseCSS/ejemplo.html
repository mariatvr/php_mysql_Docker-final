<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario sin Divs y Tabla Elegante</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- FORMULARIO SIN DIVS -->
    <form class="formulario-moderno">
        <h2>Contacto</h2>
        
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre..." required>
        
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" required>
        
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" rows="4" placeholder="Escribe aquí..."></textarea>
        
        <button type="submit">Enviar Mensaje</button>
    </form>

    <!-- TABLA ELEGANTE -->
    <table class="tabla-elegante">
        <thead>
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>#01</td>
                <td>Carlos Mendoza</td>
                <td>Administrador</td>
                <td><span class="status activo">Activo</span></td>
            </tr>
            <tr>
                <td>#02</td>
                <td>Ana Rodríguez</td>
                <td>Editora</td>
                <td><span class="status activo">Activo</span></td>
            </tr>
            <tr>
                <td>#03</td>
                <td>Luis Páez</td>
                <td>Diseñador</td>
                <td><span class="status inactivo">Inactivo</span></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
